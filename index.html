<style>

}

<div class="calc">
<div class="main">
<div class="bar"><div class="dd"><button class="modeb" id="mode"></button><div class="menu" id="menu" hidden></div></div><div class="dd"><button class="modeb" id="amode" title="Angle unit for sin, cos and tan">DEG ▾</button><div class="menu" id="amenu" hidden></div></div><div class="dd" id="memb" hidden><button class="modeb" id="memv" title="Memory: tap to insert M"></button><button class="memx" id="memx" title="Clear the memory">✕</button></div></div>
<div id="calcp"><div class="ed" id="ed" aria-label="Expression"></div></div>
<div id="geo" hidden></div>
<div id="fin" hidden></div>
<div id="fn" hidden></div>
<div id="pat" hidden></div>
<div id="stat" hidden></div>
<div id="eq" hidden></div>
<div id="tab" hidden></div>
<div id="tri" hidden></div>
<div class="out" id="out"><span class="dec">Enter an expression, press =</span></div>
<p class="hint">Keyboard: f fraction, / divide, r root, ^ power, p π, arrows move, Enter =. Results are exact.</p>
</div>
<div class="side"><button class="kt" id="kt">⌨ Hide keypad</button><div class="grid" id="keys"></div></div>
</div>
<script>
// ---------- exact arithmetic ----------
// A Value is an object { radicand: Fraction } meaning sum of coef * sqrt(radicand); radicand "1" = rational part.
const ab=a=>a<0n?-a:a;
const gcd=(a,b)=>{a=ab(a);b=ab(b);while(b){[a,b]=[b,a%b]}return a};
const F=(n,d=1n)=>{if(d===0n)throw Error("Division by zero");if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return{n:n/g,d:d/g}};
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const fmul=(a,b)=>F(a.n*b.n,a.d*b.d);
const fz=a=>a.n===0n;
function root(n){ // n = o^2 * i, i square-free
  let o=1n,i=n;
  for(let p=2n;p*p<=i&&p<1000000n;p++){while(i%(p*p)===0n){i/=p*p;o*=p}}
  return[o,i];
}
function add(a,b,s=1n){
  const r={...a};
  for(const k in b){const c=fmul(b[k],F(s));r[k]=r[k]?fadd(r[k],c):c;if(fz(r[k]))delete r[k]}
  return r;
}
// term keys: "k" = sqrt(k); "k@p" = sqrt(k)·π^p
const APX=Symbol("apx");let APXF=false,lastAns=null,memory=null;
let angleMode="deg";
const kp=k=>{const a=k.split("@");return[BigInt(a[0]),a[1]?+a[1]:0,a[2]?+a[2]:0]};
const mkk=(r,p,q)=>String(r)+((p||q)?"@"+(p||0)+(q?"@"+q:""):"");
function mul(a,b){
  let r={};
  for(const ka in a)for(const kb in b){
    const[ra,pa,qa]=kp(ka),[rb,pb,qb]=kp(kb);
    const[o,i]=root(ra*rb);
    r=add(r,{[mkk(i,pa+pb,qa+qb)]:fmul(fmul(a[ka],b[kb]),F(o))});
  }
  return r;
}
const keys=v=>Object.keys(v);
const isRat=v=>keys(v).every(k=>k==="1");
const ratOf=v=>v["1"]||F(0n);
function div(a,b){
  const ks=keys(b);
  if(!ks.length)throw Error("Division by zero");
  let inv;
  if(ks.length===1){ // 1/(c√r π^p) = √r π^−p /(c·r)
    const k=ks[0],c=b[k],[r,p,q]=kp(k);
    inv={[mkk(r,-p,-q)]:F(c.d,c.n*r)};
  }else if(ks.length===2&&ks.includes("1")&&ks.every(x=>!x.includes("@"))){ // conjugate: 1/(p+q√k)
    const k=ks.find(x=>x!=="1"),p=b["1"],q=b[k];
    const den=add({"1":fmul(p,p)},{"1":fmul(fmul(q,q),F(BigInt(k)))},-1n)["1"];
    if(!den)throw Error("Division by zero");
    inv={"1":fmul(p,F(den.d,den.n)),[k]:fmul(fmul(q,F(-1n)),F(den.d,den.n))};
  }else throw Error("Can’t simplify this division exactly");
  return mul(a,inv);
}
function sqrt(a){
  if(!isRat(a))throw Error("Can’t simplify the root of a surd exactly");
  const r=ratOf(a);
  if(r.n<0n)throw Error("Square root of a negative number");
  if(r.n===0n)return{};
  const [o,i]=root(r.n*r.d);
  return{[i]:F(o,r.d)};
}
function pow(a,e){
  if(!isRat(e))throw Error("Exponent must be a number");
  const r=ratOf(e);
  if(r.d===2n&&r.n===1n)return sqrt(a);
  if(r.d!==1n||ab(r.n)>200n)throw Error("Exponent must be a whole number");
  let res={"1":F(1n)},n=ab(r.n);
  for(let i=0n;i<n;i++)res=mul(res,a);
  return r.n<0n?div({"1":F(1n)},res):res;
}
// ---------- functions for the calculator ----------
const toNum=v=>keys(v).reduce((t,k)=>{const[r,p,q]=kp(k);return t+Number(v[k].n)/Number(v[k].d)*Math.sqrt(Number(r))*Math.PI**p*Math.E**q},0);
const rat=(p,q=1n)=>{const f=F(BigInt(p),BigInt(q));return f.n===0n?{}:{"1":f}};
function apx(x){
  if(!isFinite(x))throw Error("Math error");
  APXF=true;const q=Math.round(x*1e10);
  return q===0?{}:{"1":F(BigInt(q),10000000000n)}}
const PIV=()=>({"1@1":F(1n)}),EV=()=>({"1@0@1":F(1n)});
function divE(a,b){try{return div(a,b)}catch(e){if(/zero/.test(e.message))throw e;return apx(toNum(a)/toNum(b))}}
function sinBase(x){return x===0?{}:x===30?{"1":F(1n,2n)}:x===45?{"2":F(1n,2n)}:x===60?{"3":F(1n,2n)}:x===90?{"1":F(1n)}:null}
function sinDeg(n){
  let t=((n%360)+360)%360,sg=1;
  if(t>=180){t-=180;sg=-1}
  if(t>90)t=180-t;
  const b=sinBase(t);
  return b===null?null:(sg<0?add({},b,-1n):b)}
function trigE(fn,v){
  let dv=null; // the angle in degrees, when it can be found exactly
  if(angleMode==="deg")dv=v;
  else{const ks=keys(v);if(!ks.length)dv=v;else if(ks.length===1&&ks[0]==="1@1")dv={"1":fmul(v["1@1"],F(180n))}}
  if(dv&&isRat(dv)&&ratOf(dv).d===1n&&ab(ratOf(dv).n)<100000000n){
    const n=Number(ratOf(dv).n),s=sinDeg(n),c=sinDeg(n+90);
    if(s!==null&&c!==null){
      if(fn==="sin")return s;
      if(fn==="cos")return c;
      if(!keys(c).length)throw Error("Math error: tan is undefined");
      return div(s,c)}}
  const r=angleMode==="rad"?toNum(v):toNum(v)*Math.PI/180;
  if(fn==="tan"&&Math.abs(Math.cos(r))<1e-12)throw Error("Math error: tan is undefined");
  return apx(Math[fn](r))}
function invTrigE(fn,v){
  const x=toNum(v);
  if(fn!=="atan"&&Math.abs(x)>1+1e-12)throw Error("Math error: the value must be between −1 and 1");
  const d=Math[fn](fn==="atan"?x:Math.max(-1,Math.min(1,x)))*180/Math.PI,rd=Math.round(d),exact=Math.abs(d-rd)<1e-9;
  if(angleMode==="rad")return exact?(rd===0?{}:{"1@1":F(BigInt(rd),180n)}):apx(d*Math.PI/180);
  return exact?rat(rd):apx(d)}
function lnE(v){
  const x=toNum(v);
  if(!(x>0))throw Error("Math error: ln of a non-positive number");
  const ks=keys(v);
  if(ks.length===1){
    const[r,p,q]=kp(ks[0]),c=v[ks[0]];
    if(r===1n&&p===0&&c.n===1n&&c.d===1n)return q===0?{}:rat(q)} // ln 1 = 0, ln e^q = q
  return apx(Math.log(x))}
function combE(o,nv,rv){
  const n=ratOf(nv),r=ratOf(rv);
  if(!isRat(nv)||!isRat(rv)||n.d!==1n||r.d!==1n||n.n<0n||r.n<0n||r.n>n.n||n.n>1000n)throw Error("Math error: n and r must be whole numbers with 0 ≤ r ≤ n");
  let p=1n;for(let i=0n;i<r.n;i++)p*=n.n-i;
  if(o==="nPr")return rat(p);
  let f=1n;for(let i=2n;i<=r.n;i++)f*=i;
  return rat(p/f)}
function logE(bv,xv){
  const b=toNum(bv),x=toNum(xv);
  if(!(b>0&&b!==1))throw Error("Math error: the base must be positive and not 1");
  if(!(x>0))throw Error("Math error: log of a non-positive number");
  const L=Math.log(x)/Math.log(b);
  for(let q=1;q<=6;q++){const p=Math.round(L*q);if(Math.abs(L*q-p)<1e-9)return rat(p,q)}
  return apx(L)}
function factE(v){
  const r=ratOf(v);
  if(!isRat(v)||r.d!==1n||r.n<0n||r.n>69n)throw Error("Math error: n! needs a whole number from 0 to 69");
  let p=1n;for(let i=2n;i<=r.n;i++)p*=i;return rat(p)}
function iroot(b,n){
  const c=BigInt(Math.round(Math.pow(Number(b),1/n)));
  for(let d=-1n;d<=1n;d++){const t=c+d;if(t>=0n&&t**BigInt(n)===b)return t}
  return null}
function nrootE(nv,xv){
  const n=toNum(nv),x=toNum(xv);
  if(!(Number.isInteger(n)&&n>=2&&n<=100))throw Error("The root index must be a whole number from 2 to 100");
  if(x<0&&n%2===0)throw Error("Math error: even root of a negative number");
  if(n===2){try{return sqrt(xv)}catch(e){return apx(Math.sqrt(x))}}
  if(isRat(xv)){
    const r=ratOf(xv),neg=r.n<0n,pn=iroot(ab(r.n),n),pd=iroot(r.d,n);
    if(pn!==null&&pd!==null)return rat(neg?-pn:pn,pd)}
  return apx(x<0?-Math.pow(-x,1/n):Math.pow(x,1/n))}
const sqrtE=x=>nrootE(rat(2),x);
function powG(a,e){
  if(isRat(e)){
    const r=ratOf(e);
    if(r.d===1n&&ab(r.n)<=200n)return pow(a,e);
    if(r.d<=20n&&ab(r.n)<=200n){
      const base=r.n>=0n?pow(a,rat(r.n)):divE(rat(1),pow(a,rat(-r.n)));

    const key=ser(A.root),v=evaluate(key);
    const it=A.root.items,sole=it.length===1&&isN(it[0])&&it[0].t==="par"&&it[0].fn==="factor";
    if(FACT&&!sole)throw Error("Fact works on its own: Fact(number)");
    let main,dec="";
    if(FACT){
      const r=ratOf(v);
      if(!isRat(v)||r.d!==1n||r.n<2n||r.n>10000000000000n)throw Error("Fact needs a whole number from 2 to 10 000 000 000 000");
      const n=Number(r.n),pf=primeFactors(n);
      main=pf.length===1&&pf[0][1]===1?`${n} is a prime number`:`${n} = ${pf.map(([p,e])=>e>1?`${p}<sup>${e}</sup>`:p).join(" × ")}`}
    else{
      const decShown=v[APX]||keys(v).some(k=>v[k].d>100000000n),isInt=isRat(v)&&(!keys(v).length||ratOf(v).d===1n);
      main=show(v);
      dec=(decShown||isInt)?"":`≈ ${cm(+toNum(v).toPrecision(10))}`}
    lastAns=v;justEval=true;
    out.innerHTML=`<div>${main}</div>${dec?`<div class="dec">${dec}</div>`:""}`;
    pushHistory(key,main,dec)}
  catch(e){justEval=false;out.innerHTML=`<span class="err">${e.message}</span>`}}
function clearAll(){

  else{root0.items=[];cur={seq:root0,i:0}}

const OPKEYS=new Set(["+","−","×","÷","x²","pow","fact","exp10","%","inv","nCr","nPr"]),NAVKEYS=new Set(["◀","▶","▲","▼","⌫"]);
function applySel(k){ // a selected piece of text is replaced by what is typed next
  const s=sel;sel=null;
  if(!s||s.E!==A||s.from>=s.to)return false;
  if(k==="◀"){cur={seq:s.seq,i:s.from};return true}
  if(k==="▶"){cur={seq:s.seq,i:s.to};return true}
  if(k==="="||k==="enter"||k==="AC"||k==="▲"||k==="▼")return false;
  s.seq.items.splice(s.from,s.to-s.from);cur={seq:s.seq,i:s.from};
  justEval=false;
  return k==="⌫"}

function memAdd(){
  try{
    let v=null;
    if(A===mainE&&mainE.root.items.length)v=evaluate(ser(mainE.root));
    else if(lastAns)v=lastAns;
    if(!v)throw Error("Nothing to store yet: enter a value or press = first");
    const apxF=v[APX]||(memory&&memory[APX]);
    memory=memory?add(memory,v):{...v};
    if(apxF)memory[APX]=true;
    updMem()}

function press(k){

  if(k==="M+"){memAdd();return}
  if(applySel(k)){A.cur=cur;refresh();A.host.focus({preventScroll:true});return}

    if(NAVKEYS.has(k))justEval=false;
    else if(k!=="AC"){ // after "=": an operator continues from the answer, anything else starts afresh
      root0.items=[];cur={seq:root0,i:0};
      if(OPKEYS.has(k))ins("Ans");
      justEval=false}}
