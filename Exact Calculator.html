<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exact Calculator</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--key:#ecebe6;--acc:#b3261e;--bd:#d9d7cf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f1f0ea;--mut:#a3a199;--key:#34342f;--acc:#ff8a80;--bd:#44433d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f1f0ea;--mut:#a3a199;--key:#34342f;--acc:#ff8a80;--bd:#44433d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
.calc{width:100%;max-width:860px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr minmax(260px,340px);gap:24px;align-items:start}
.side{position:sticky;top:16px;order:2}
.main{min-width:0;order:1}
.kt{display:none;width:100%;padding:4px;font-size:12px;background:none;color:var(--mut);margin-bottom:4px}
.ed{scroll-margin-top:var(--oh,120px);scroll-margin-bottom:var(--kh,0px)}
@media (max-width:720px){
body{padding:0}
.calc{max-width:none;border:0;border-radius:0;padding:10px 10px calc(var(--kh,0px) + 12px);display:block}
.main{display:flex;flex-direction:column}
.bar{order:0}
.out{order:1;position:sticky;top:0;z-index:4;background:var(--card);min-height:56px;font-size:22px;padding:8px 4px;border-bottom:1px solid var(--bd);margin-bottom:8px;max-height:38vh;overflow-y:auto}
#calcp,#geo,#fin{order:2}
.hint{order:3}
.side{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--bd);padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.grid{gap:5px;margin-top:0}
.grid button{padding:9px 0;font-size:17px}
.kt{display:block}
.side.collapsed .grid{display:none}
}

.out{min-height:90px;padding:14px 4px;font-size:28px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.dec{font-size:15px;color:var(--mut)}
.err{font-size:15px;color:var(--acc)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.2;font-size:.85em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.rt{border-top:1.5px solid currentColor;padding:0 2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font-size:20px;padding:14px 0;border:0;border-radius:10px;background:var(--key);color:var(--tx);cursor:pointer}
button.op{color:var(--acc);font-weight:600}
button.eq{background:var(--acc);color:var(--bg)}
button:active{opacity:.7}
.hint{font-size:12px;color:var(--mut);margin:10px 2px 0}
.ed{min-height:64px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-size:24px;display:flex;align-items:center;flex-wrap:wrap;overflow-x:auto;outline:none}
.ed:focus{border-color:var(--acc)}
.sq{display:inline-flex;align-items:center;min-height:1.2em}

.ef{display:inline-flex;flex-direction:column;align-items:center;margin:0 3px;font-size:.9em}

.sx>.sq{border-top:1.5px solid currentColor;padding:2px 2px 0}
.rd{width:.6em;flex:none;align-self:stretch;overflow:visible;margin-top:.75px}
.pw{display:inline-flex;font-size:.65em;align-self:flex-start;margin-left:1px}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--acc);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.grid{margin-top:4px}
.bar{position:relative;margin-bottom:10px}
.modeb{width:auto;padding:8px 14px;font-size:15px;font-weight:600;background:var(--key)}

.menu[hidden]{display:none}
.menu button{text-align:left;padding:10px 12px;font-size:15px;background:none}
.menu button.on{color:var(--acc);font-weight:600}
.pt{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:22px}
.pt b{width:1.2em}
.ed.sm{flex:1;min-width:0;min-height:52px;font-size:20px;padding:6px 8px}

.res .lb{color:var(--mut);margin-right:6px}
.res .dec{margin-left:8px}
.fld{margin-bottom:8px}
.fld .lb2{font-size:13px;color:var(--mut);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
.chips span{font-size:13px;color:var(--mut)}
.chips button{width:auto;padding:6px 10px;font-size:13px}
.chips button.on{background:var(--acc);color:var(--bg)}
.res.big{font-size:28px}
.chips.dim2{opacity:.4;pointer-events:none}
.fld.dim{opacity:.4}
.fld.dim .ed{pointer-events:none;background:transparent}
.res sup,.res sub,.lb2 sub{font-size:.65em}
</style></head><body>
<div class="calc">
<div class="side"><button class="kt" id="kt">⌨ Hide keypad</button><div class="grid" id="keys"></div></div>
<div class="main">
<div class="bar"><button class="modeb" id="mode"></button><div class="menu" id="menu" hidden></div></div>
<div id="calcp"><div class="ed" id="ed" aria-label="Expression"></div></div>
<div id="geo" hidden></div>
<div id="fin" hidden></div>
<div id="quad" hidden></div>
<div id="pat" hidden></div>
<div class="out" id="out"><span class="dec">Enter an expression, press =</span></div>
<p class="hint">Keyboard: / fraction, r root, ^ power, arrows move, Enter =. Results are exact.</p>
</div>
</div>
<script>
// ---------- exact arithmetic ----------
// A Value is an object { radicand: Fraction } meaning sum of coef * sqrt(radicand); radicand "1" = rational part.
const ab=a=>a<0n?-a:a;
const gcd=(a,b)=>{a=ab(a);b=ab(b);while(b){[a,b]=[b,a%b]}return a};
const F=(n,d=1n)=>{if(d===0n)throw Error("Division by zero");if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return{n:n/g,d:d/g}};
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d);
const fmul=(a,b)=>F(a.n*b.n,a.d*b.d);
const fz=a=>a.n===0n;
function root(n){ // n = o^2 * i, i square-free
  let o=1n,i=n;
  for(let p=2n;p*p<=i&&p<1000000n;p++){while(i%(p*p)===0n){i/=p*p;o*=p}}
  return[o,i];
}
function add(a,b,s=1n){
  const r={...a};
  for(const k in b){const c=fmul(b[k],F(s));r[k]=r[k]?fadd(r[k],c):c;if(fz(r[k]))delete r[k]}
  return r;
}
function mul(a,b){
  let r={};
  for(const ka in a)for(const kb in b){
    const [o,i]=root(BigInt(ka)*BigInt(kb));
    r=add(r,{[i]:fmul(fmul(a[ka],b[kb]),F(o))});
  }
  return r;
}
const keys=v=>Object.keys(v);
const isRat=v=>keys(v).every(k=>k==="1");
const ratOf=v=>v["1"]||F(0n);
function div(a,b){
  const ks=keys(b);
  if(!ks.length)throw Error("Division by zero");
  let inv;
  if(ks.length===1){ // 1/(c√k) = √k/(c·k)
    const k=ks[0],c=b[k];
    inv={[k]:F(1n,1n)};
    inv={[k]:fmul(F(1n),F(c.d,c.n*BigInt(k)))};
  }else if(ks.length===2&&ks.includes("1")){ // conjugate: 1/(p+q√k)
    const k=ks.find(x=>x!=="1"),p=b["1"],q=b[k];
    const den=add({"1":fmul(p,p)},{"1":fmul(fmul(q,q),F(BigInt(k)))},-1n)["1"];
    if(!den)throw Error("Division by zero");
    inv={"1":fmul(p,F(den.d,den.n)),[k]:fmul(fmul(q,F(-1n)),F(den.d,den.n))};
  }else throw Error("Can’t simplify this division exactly");
  return mul(a,inv);
}
function sqrt(a){
  if(!isRat(a))throw Error("Can’t simplify the root of a surd exactly");
  const r=ratOf(a);
  if(r.n<0n)throw Error("Square root of a negative number");
  if(r.n===0n)return{};
  const [o,i]=root(r.n*r.d);
  return{[i]:F(o,r.d)};
}
function pow(a,e){
  if(!isRat(e))throw Error("Exponent must be a number");
  const r=ratOf(e);
  if(r.d===2n&&r.n===1n)return sqrt(a);
  if(r.d!==1n||ab(r.n)>200n)throw Error("Exponent must be a whole number");
  let res={"1":F(1n)},n=ab(r.n);
  for(let i=0n;i<n;i++)res=mul(res,a);
  return r.n<0n?div({"1":F(1n)},res):res;
}
// ---------- parser ----------
function tokenize(s){
  const t=[],re=/\s*(\d+(?:[.,]\d+)?|sqrt|√|[-+*/×÷^()−])/gy;
  let m,last=0;
  while((m=re.exec(s))){t.push(m[1]);last=re.lastIndex}
  if(s.slice(last).trim())throw Error("Unexpected “"+s.slice(last).trim()[0]+"”");
  return t;
}
function evaluate(s){
  const t=tokenize(s);let p=0;
  const peek=()=>t[p],next=()=>t[p++];
  const num=x=>{const[i,f=""]=x.replace(",",".").split(".");return{"1":F(BigInt(i+f),10n**BigInt(f.length))}};
  const startsAtom=x=>x!==undefined&&(/^\d/.test(x)||x==="("||x==="sqrt"||x==="√");
  function expr(){
    let v=term();
    while(peek()==="+"||peek()==="-"||peek()==="−"){const o=next();const r=term();v=add(v,r,o==="+"?1n:-1n)}
    return v;
  }
  function term(){
    let v=unary();
    for(;;){
      const x=peek();
      if(x==="*"||x==="×"){next();v=mul(v,unary())}
      else if(x==="/"||x==="÷"){next();v=div(v,unary())}
      else if(startsAtom(x)){v=mul(v,unary())} // implicit multiplication: 2√3, 3(4+1)
      else return v;
    }
  }
  function unary(){
    if(peek()==="-"||peek()==="−"){next();return add({},unary(),-1n)}
    if(peek()==="+"){next();return unary()}
    return power();
  }
  function power(){
    const b=atom();
    if(peek()==="^"){next();return pow(b,unary())}
    return b;
  }
  function atom(){
    const x=next();
    if(x===undefined)throw Error("Expression ended early");
    if(/^\d/.test(x))return num(x);
    if(x==="("){const v=expr();if(next()!==")")throw Error("Missing )");return v}
    if(x==="sqrt"||x==="√")return sqrt(atom());
    throw Error("Unexpected “"+x+"”");
  }
  const v=expr();
  if(p<t.length)throw Error("Unexpected “"+t[p]+"”");
  return v;
}
// ---------- display ----------
const fr=(n,d)=>d===1n?`${n}`:`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const RAD='<svg class="rd" viewBox="0 0 10 20" preserveAspectRatio="none"><path d="M0 12 L2 10.5 L5 19 L10 0" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
function show(v){
  const ks=keys(v).sort((a,b)=>+a-+b);
  if(!ks.length)return"0";
  let html="",first=true;
  for(const k of ks){
    const c=v[k],neg=c.n<0n,n=ab(c.n);
    const body=k==="1"?`${n}`:`${n===1n?"":n}<span class="sx">${RAD}<span class="sq">${k}</span></span>`;
    const term=c.d===1n?body:fr(body,c.d);
    html+=first?(neg?"−":""):(neg?" − ":" + ");
    html+=term;first=false;
  }
  return html;
}
const toNum=v=>keys(v).reduce((s,k)=>s+Number(v[k].n)/Number(v[k].d)*Math.sqrt(+k),0);
// ---------- natural-display editor ----------
const mkSeq=p=>({items:[],parent:p||null});
let root0=mkSeq();let cur={seq:root0,i:0};
const kids=n=>n.t==="frac"?[n.a,n.b]:[n.a];
const isN=x=>typeof x==="object";
function mk(t){const n={t};n.a=mkSeq(n);if(t==="frac")n.b=mkSeq(n);return n}
function ins(x){cur.seq.items.splice(cur.i,0,x);if(isN(x))x.host=cur.seq;cur.i++}
function insNode(t,pre){
  const n=mk(t),q=cur.seq,it=q.items;let moved=[];
  if(t==="frac"){let j=cur.i;while(j>0&&typeof it[j-1]==="string"&&/^[\d.]$/.test(it[j-1]))j--;moved=it.splice(j,cur.i-j);n.a.items=moved;cur.i=j}
  it.splice(cur.i,0,n);n.host=q;
  if(pre){n.a.items=[...pre]}
  cur={seq:(t==="frac"&&moved.length)?n.b:n.a,i:0};
  if(pre)cur.i=n.a.items.length;
}
function right(){const{seq,i}=cur,it=seq.items[i];
  if(it&&isN(it)){cur={seq:it.a,i:0};return}
  if(i<seq.items.length){cur.i++;return}
  const p=seq.parent;if(!p){navField(1,1,true);return}
  if(p.t==="frac"&&seq===p.a){cur={seq:p.b,i:0};return}
  cur={seq:p.host,i:p.host.items.indexOf(p)+1}}
function left(){const{seq,i}=cur,it=seq.items[i-1];
  if(it&&isN(it)){const s=it.b||it.a;cur={seq:s,i:s.items.length};return}
  if(i>0){cur.i--;return}
  const p=seq.parent;if(!p){navField(-1,1,true);return}
  if(p.t==="frac"&&seq===p.b){cur={seq:p.a,i:p.a.items.length};return}
  cur={seq:p.host,i:p.host.items.indexOf(p)}}
function vert(down){const p=cur.seq.parent;
  if(p&&p.t==="frac"){
    if(down&&cur.seq===p.a){cur={seq:p.b,i:0};return}
    if(!down&&cur.seq===p.b){cur={seq:p.a,i:p.a.items.length};return}}
  navField(down?1:-1,mode==="geo"?2:1)}
function navField(d,step,horiz){
  const L=grp(),k=L.indexOf(A),t=L[k+d*step];
  if(!t||k<0)return;
  t.cur={seq:t.root,i:(horiz&&d>0)?0:t.root.items.length};
  t.host.focus()}
function back(){const{seq,i}=cur;
  if(i>0){const it=seq.items[i-1];
    if(!isN(it)||kids(it).every(s=>!s.items.length)){seq.items.splice(i-1,1);cur.i--}else left();return}
  const p=seq.parent;
  if(p&&kids(p).every(s=>!s.items.length)){const h=p.host,k=h.items.indexOf(p);h.items.splice(k,1);cur={seq:h,i:k}}else left()}
function ser(seq){return seq.items.map(it=>{
  if(!isN(it))return it;
  if(kids(it).some(s=>!s.items.length))throw Error("Fill in the empty box");
  if(it.t==="frac")return`((${ser(it.a)})/(${ser(it.b)}))`;
  return(it.t==="sqrt"?"sqrt(":"^(")+ser(it.a)+")"}).join("")}
// ---------- rendering ----------
const el=(c,t)=>{const e=document.createElement("span");e.className=c;if(t)e.textContent=t;return e};
function R(seq){
  const e=el("sq"+(seq.items.length?"":" ph")),here=cur.seq===seq;
  seq.items.forEach((it,k)=>{if(here&&cur.i===k)e.appendChild(el("caret"));e.appendChild(N(it))});
  if(here&&cur.i===seq.items.length)e.appendChild(el("caret"));
  return e}
function rad(){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 10 20");s.setAttribute("preserveAspectRatio","none");s.setAttribute("class","rd");const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M0 12 L2 10.5 L5 19 L10 0");p.setAttribute("fill","none");p.setAttribute("stroke","currentColor");p.setAttribute("stroke-width","1.5");p.setAttribute("vector-effect","non-scaling-stroke");s.appendChild(p);return s}
function N(it){
  if(!isN(it))return el("",it==="*"?"×":it==="-"?"−":it);
  if(it.t==="frac"){const f=el("ef");f.append(R(it.a),R(it.b));return f}
  if(it.t==="sqrt"){const f=el("sx");f.append(rad(),R(it.a));return f}
  const p=el("pw");p.appendChild(R(it.a));return p}
const out=document.getElementById("out");
// ---------- editor instances ----------
let A=null,mode="calc";
const editors=[];
function Ed(host){
  const E={root:mkSeq(),host};E.cur={seq:E.root,i:0};
  host.tabIndex=0;editors.push(E);
  host.addEventListener("focus",()=>activate(E));
  host.addEventListener("keydown",e=>{
    const m={ArrowLeft:"◀",ArrowRight:"▶",ArrowUp:"▲",ArrowDown:"▼",Backspace:"⌫",Enter:"=","/":"a/b","^":"^",r:"√","*":"×","-":"−"};
    let a=m[e.key];if(!a&&/^[\d.+()]$/.test(e.key))a=e.key;
    if(a){e.preventDefault();press(a)}});
  return E}
function activate(E){
  if(A===E)return;
  if(A)A.cur=cur;
  A=E;root0=E.root;cur=E.cur;redraw();
  if(matchMedia("(max-width:720px)").matches)E.host.scrollIntoView({block:"nearest"})}
const redraw=()=>editors.forEach(E=>E.host.replaceChildren(R(E.root)));
const mainE=Ed(document.getElementById("ed"));
// ---------- geometry mode ----------
const geoEds=[],geo=document.getElementById("geo");
["A","B"].forEach((n,k)=>{
  const row=document.createElement("div");row.className="pt";
  const mkEd=()=>{const d=document.createElement("div");d.className="ed sm";geoEds.push(Ed(d));return d};
  const t=x=>{const s=document.createElement("span");s.textContent=x;return s};
  const b=document.createElement("b");b.textContent=n;
  row.append(b,t("("),mkEd(),t(","),mkEd(),t(")"));geo.appendChild(row)});
const needDec=v=>!(isRat(v)&&(keys(v).length===0||ratOf(v).d===1n));
const row=(l,h,v)=>`<div class="res"><span class="lb">${l}</span>${h}${v!==undefined?`<span class="dec">≈ ${+v.toPrecision(10)}</span>`:""}</div>`;
function geoCalc(){
  if(geoEds.some(E=>!E.root.items.length)){out.innerHTML='<span class="dec">Enter points A and B</span>';return}
  try{
    const[x1,y1,x2,y2]=geoEds.map(E=>evaluate(ser(E.root)));
    const dx=add(x2,x1,-1n),dy=add(y2,y1,-1n),two={"1":F(2n)};
    let h="";
    const dd=Math.hypot(toNum(dx),toNum(dy));

    catch(e){h+=row("d ≈",String(+dd.toPrecision(10)))}
    if(!keys(dx).length)h+=row("m =","undefined (vertical line)");
    else try{const m=div(dy,dx);h+=row("m =",show(m),needDec(m)?toNum(m):undefined)}
    catch(e){h+=row("m ≈",String(+(toNum(dy)/toNum(dx)).toPrecision(10)))}
    try{const mx=div(add(x1,x2),two),my=div(add(y1,y2),two);
      h+=row("M =",`(&nbsp;${show(mx)}&nbsp;;&nbsp;${show(my)}&nbsp;)`)}
    catch(e){}
    out.innerHTML=h}
  catch(e){out.innerHTML=`<span class="dec">${e.message}</span>`}}
// ---------- finance mode: choose a formula, leave one value empty ----------
const finEl=document.getElementById("fin");
const finDefs=[["P","Principal P (R)"],["A","Final amount A (R)"],["x","Payment x per period (R)"],["F","Future value Fv (R)"],["V","Present value Pv (R)"],["B","Outstanding balance B (R)"],["i","Interest rate i (%); divided by m when m is given"],["n","Number of periods n"],["m","Periods per year m (optional)"]];
const FORMS={simple:["P","A","i","n"],comp:["P","A","i","n"],fv:["x","F","i","n"],pv:["x","V","i","n"],bal:["x","B","i","n"]};
let form="comp",mOff=true;
const finE={},finRow={};
const FRc=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const FORMULA={
  simple:'A = P(1 + in)',
  comp:'A = P(1 + i)<sup>n</sup>',
  fv:`Fv = x[${FRc("(1 + i)<sup>n</sup> − 1","i")}]`,

  try{const v=evaluate(ser(A.root));
    out.innerHTML=`<div>${show(v)}</div><div class="dec">≈ ${+toNum(v).toPrecision(10)}</div>`}
  catch(e){out.innerHTML=`<span class="err">${e.message}</span>`}}
function clearAll(){
  if(mode!=="calc"){grp().filter(E=>E!==finE.m).forEach(E=>{E.root.items=[];E.cur={seq:E.root,i:0}});root0=A.root;cur=A.cur}
  else{root0.items=[];cur={seq:root0,i:0}}
  out.innerHTML=""}
function nextField(){const L=grp(),k=L.indexOf(A);L[(k+1)%L.length].host.focus()}
const act={
  "a/b":()=>insNode("frac"),"√":()=>insNode("sqrt"),"x²":()=>insNode("pow",["2"]),"^":()=>insNode("pow"),
  "◀":left,"▶":right,"▲":()=>vert(false),"▼":()=>vert(true),"⌫":back,"C":clearAll,"=":()=>mode==="calc"?calc():nextField()};
function refresh(){redraw();if(mode==="geo")geoCalc();if(mode==="fin")finCalc();if(mode==="quad")quadCalc();if(mode==="pat")patCalc()}
function press(k){
  if(!A)return;
  if(act[k])act[k]();else ins(k==="×"?"*":k==="−"?"-":k);
  A.cur=cur;refresh();if(k!=="=")A.host.focus()}
const layout=[["a/b","√","x²","^"],["◀","▲","▼","▶"],["7","8","9","⌫"],["4","5","6","×"],["1","2","3","−"],["0",".","(",")"],["C","+","="]];
layout.flat().forEach(k=>{
  const b=document.createElement("button");b.textContent=k;
  if("×−+^√a/b x²".includes(k)&&k.length<=3)b.className="op";
  if(k==="=")b.className="eq",b.style.gridColumn="span 2";
  b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>press(k);
  document.getElementById("keys").appendChild(b)});
const sideEl=document.querySelector(".side"),kt=document.getElementById("kt");
const sync=()=>{const r=document.documentElement.style;r.setProperty("--kh",sideEl.offsetHeight+"px");r.setProperty("--oh",(out.offsetHeight+8)+"px")};
new ResizeObserver(sync).observe(sideEl);new ResizeObserver(sync).observe(out);
kt.onmousedown=e=>e.preventDefault();
kt.onclick=()=>{sideEl.classList.toggle("collapsed");kt.textContent=sideEl.classList.contains("collapsed")?"⌨ Show keypad":"⌨ Hide keypad"};
activate(mainE);setMode("calc");
</script></body></html>
